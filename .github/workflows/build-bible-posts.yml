name: Build Bible Posts

# Batch render, run whenever bible.json (or this build) changes, or by hand.
# It bundles Remotion once and renders all 365 verse cards, then
# uploads them to a single GitHub Release so the daily workflow can post
# from a pre-built image instead of rendering every day.
# Push trigger added 2026-11-05 (DEC-JR-016) so the KJV switch rebuilds the cards on merge.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/bible.json
      - scripts/build-all-bible-posts.ts
      - .github/workflows/build-bible-posts.yml

permissions:
  contents: write

# One run at a time; never cancel a run that may be mid-push (DEC-JR-007).
concurrency:
  group: jr-build-bible-posts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Render all 365 verse cards
        run: npm run build-bible-posts

      - name: Upload as GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.ACTION_GITHUB }}
        run: |
          TAG="bible-posts-v3-kjv"   # KJV cards (2026-11-05, DEC-JR-016); v2 held BSB, v1 NIV -- never reused
          gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --notes "Pre-built daily Bible verse cards, King James Version (public domain). See scripts/build-all-bible-posts.ts"
          gh release upload "$TAG" output/bible_verse_batch/*.png --clobber
