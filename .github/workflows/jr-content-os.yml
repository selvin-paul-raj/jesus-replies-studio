name: JR content OS
# Weekly brain + daily verification for Jesus Replies.
# Autonomous cadence is OFF. Uncomment only after Selvin authorizes it:
# on:
#   schedule:
#     - cron: '30 12 * * 6'   # Sat 18:00 IST: weekly (snapshot, plan, report, schedule dry run)
#     - cron: '0 */6 * * *'   # every 6h: verify publications + metrics snapshot
on:
  workflow_dispatch:
    inputs:
      command:
        description: snapshot | attributes | inventory | plan | report | weekly | verify | schedule
        required: true
        default: weekly
      week_start:
        description: Monday YYYY-MM-DD
        required: false
      episode:
        description: episode id (hold only)
        required: false
      platform:
        description: instagram | youtube (hold only)
        required: false
      dry_run:
        description: true = no Buffer mutations (schedule only)
        required: true
        default: 'true'
permissions:
  contents: write
concurrency:
  group: jr-content-os
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Safety tests
        run: python3 -m unittest tests.test_content_os tests.test_daily
      - name: Run
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CMD: ${{ inputs.command }}
          WEEK: ${{ inputs.week_start }}
          DRY: ${{ inputs.dry_run }}
          EP: ${{ inputs.episode }}
          PL: ${{ inputs.platform }}
        run: |
          args="$CMD"
          [ -n "$WEEK" ] && args="$args --week $WEEK"
          [ "$DRY" = "true" ] && { [ "$CMD" = "schedule" ] || [ "$CMD" = "hold" ]; } && args="$args --dry-run"
          [ -n "$EP" ] && args="$args --episode $EP --platform $PL"
          python3 scripts/content_os/cli.py $args
      - name: Commit state
        if: always()
        run: |
          git config user.name "jr-content-os"
          git config user.email "115263986+selvin-paul-raj@users.noreply.github.com"
          git add content-os episodes generated/attributes 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "automation: content OS ${{ inputs.command }} ${{ github.run_id }} [skip ci]"
          git pull --rebase -q && git push
