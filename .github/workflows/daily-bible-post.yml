name: Daily Bible Verse Post

on:
  schedule:
    # 06:37 IST (01:07 UTC): off the top of the hour, when GitHub's scheduler is busiest and
    # delays runs (cards used to land 10:45-12:30 IST). Posts as an Instagram Story
    # (config/publishing-rules.json daily_verse).
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post even if today's date was already recorded"
        type: boolean
        default: false

permissions:
  contents: write

# One run at a time; never cancel a run that may be mid-push (DEC-JR-007).
concurrency:
  group: jr-daily-bible-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run daily Bible post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          FORCE_POST: ${{ inputs.force }}
        run: npm run bible-post

      - name: Commit dedupe state
        run: |
          if ! git diff --quiet -- data/bible-post-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/bible-post-state.json
            git commit -m "chore: record daily Bible post state [skip ci]"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          else
            echo "No state change to commit (post was skipped or already recorded)."
          fi
