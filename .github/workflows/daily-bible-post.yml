name: Daily Bible Verse Post

on:
  schedule:
    # 6:30 AM IST (UTC+5:30) every day = 01:00 UTC.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post even if today's date was already recorded"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run daily Bible post
        env:
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_POST: ${{ inputs.force }}
        run: npm run bible-post

      - name: Commit dedupe state
        run: |
          if ! git diff --quiet -- data/bible-post-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/bible-post-state.json
            git commit -m "chore: record daily Bible post state [skip ci]"
            git push
          else
            echo "No state change to commit (post was skipped or already recorded)."
          fi
