name: Jesus Replies Buffer verify post

# READ-ONLY. Fetches one Buffer post by id. Creates, edits and deletes nothing.

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: Buffer post id to read back
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read back one Buffer post
        if: inputs.post_id != 'LIST' && inputs.post_id != 'PROBE'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/buffer_verify_post.py "${{ inputs.post_id }}"
      - name: Schema + channel probe
        if: inputs.post_id == 'PROBE'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
        run: python3 scripts/buffer_schema_probe.py
      - name: List channel posts (orphan check)
        if: inputs.post_id == 'LIST'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
        run: python3 scripts/buffer_list_drafts.py
