name: JR daily generate (autonomous)

# Autonomous since 2026-10-11 (content-os/DECISIONS.md DEC-JR-005, Selvin: "complete automous
# running system ... self correction, feeadbackloop system").
# Daily 05:00 IST: picks the reserved episodes for slots up to 3 days ahead (then authored
# spares), runs validate -> render -> render QA -> package QA -> hosting -> Buffer draft with
# bounded self-healing, auto-approves under the standing authorization, then runs the content OS
# cycle so QA-passed episodes are scheduled into their slots on Instagram and YouTube.
# Every automated gate is kept; only the human approval step is gone.

on:
  schedule:
    - cron: '30 23 * * *'   # 05:00 IST daily, before the 08:00 and 20:30 slots
  workflow_dispatch:
    inputs:
      episode_id:
        description: Optional. Advance only these episode ids (space separated). Empty = autopilot targets
        required: false
        default: ''
      dry_run:
        description: true = no upload, no Buffer post, state kept in scratch
        required: true
        default: 'false'

permissions:
  contents: write

concurrency:
  group: jr-daily-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Safety tests (mocked Buffer, no network)
        run: python3 -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ffprobe available
        run: which ffprobe || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Advance episodes (self-healing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_API_KEY: ${{ inputs.dry_run != 'true' && secrets.BUFFER_API_KEY || '' }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ inputs.dry_run != 'true' && secrets.BUFFER_INSTAGRAM_CHANNEL_ID || '' }}
          DRY: ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
          IDS_IN: ${{ inputs.episode_id }}
        run: |
          set -o pipefail
          IDS="$IDS_IN"
          if [ -z "$IDS" ]; then
            if [ -n "$DRY" ]; then echo "dry run needs episode_id"; exit 1; fi
            IDS="$(python3 scripts/content_os/cli.py autopilot-targets)"
          fi
          echo "[autopilot] targets: ${IDS:-none}"
          rc=0
          for id in $IDS; do
            [ -n "$DRY" ] || python3 scripts/daily/jr_daily.py brief "$id" > /dev/null
            if [ -n "$DRY" ]; then
              python3 scripts/daily/jr_daily.py advance "$id" $DRY || rc=1
            else
              python3 scripts/daily/jr_daily.py autoadvance "$id" || rc=1
            fi
          done
          # A failed episode never fails the run: its slot is filled by the content OS cycle.
          echo "[autopilot] advance rc=$rc"
      - name: Commit episode state
        if: always() && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes manifests generated/briefs generated/release-manifest.json generated/JR-*.json 2>/dev/null || true
          git diff --cached --quiet && { echo "[state] nothing to commit"; exit 0; }
          git commit -m "automation: daily generate state ${{ github.run_id }} [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

  schedule:
    needs: generate
    if: always() && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: jr-content-os
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Content OS cycle (authorise, sync, fill slots, schedule top-up, learnings)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/content_os/cli.py cycle
      - name: Commit state
        if: always()
        run: |
          git config user.name "jr-content-os"
          git config user.email "115263986+selvin-paul-raj@users.noreply.github.com"
          git add content-os episodes manifests generated/attributes 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "automation: content OS cycle after daily generate ${{ github.run_id }} [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
