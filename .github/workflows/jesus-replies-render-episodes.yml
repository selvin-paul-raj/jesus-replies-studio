name: Jesus Replies render episodes

# System B. Manual dispatch only. Renders a named list of episodes and measures real
# durations. It creates no release, touches no Buffer, schedules nothing and has no cron.
# It does not read or write daily-bible-post.yml or any System A state.

on:
  workflow_dispatch:
    inputs:
      episode_ids:
        description: Comma-separated episode ids, e.g. JR-0035,JR-0036
        required: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci

      - name: Authoring gate
        run: |
          set -e
          IFS=',' read -ra IDS <<< "${{ inputs.episode_ids }}"
          for id in "${IDS[@]}"; do
            id=$(echo "$id" | tr -d ' ')
            test -s "generated/$id.json" || { echo "[gate] missing generated/$id.json"; exit 1; }
            python3 - "$id" <<'PY'
import json, pathlib, sys
eid = sys.argv[1]
ep = json.loads(pathlib.Path(f"generated/{eid}.json").read_text())
b = ep["bible"]
assert b.get("text") and b.get("version") == "NIV", f"{eid} scripture missing or not NIV"
assert ep.get("lines"), f"{eid} no lines"
print(f"[gate] {eid} OK scripture={b['book']} {b['chapter']}:{b['verse']}")
PY
          done

      - name: Render (bounded concurrency)
        env:
          JR_RENDER_CONCURRENCY: 2
        run: |
          set -e
          mkdir -p output/videos
          IFS=',' read -ra IDS <<< "${{ inputs.episode_ids }}"
          for id in "${IDS[@]}"; do
            id=$(echo "$id" | tr -d ' ')
            echo "[render] $id action=RENDERING"
            npm run jr -- render "generated/$id.json" --out-dir output || { echo "[render] $id action=FAILED"; exit 1; }
          done

      - name: Render QA and real durations
        run: |
          python3 - <<'PY'
import json, pathlib, subprocess, sys
ids = [i.strip() for i in "${{ inputs.episode_ids }}".split(",") if i.strip()]
bad = []
for eid in ids:
    p = pathlib.Path(f"output/videos/{eid}.mp4")
    if not p.exists() or p.stat().st_size == 0:
        print(f"[qa] {eid} MISSING_OR_EMPTY"); bad.append(eid); continue
    out = subprocess.run(["python3", "-c", f"""
import struct, sys
d = open({str(p)!r}, 'rb').read()
i = d.find(b'mvhd')
ts, du = struct.unpack('>II', d[i+12:i+20])
print(round(du/ts, 2) if ts else 0)
"""], capture_output=True, text=True)
    dur = float(out.stdout.strip() or 0)
    status = "PASS" if 0 < dur <= 90 else "FAIL"
    if status == "FAIL": bad.append(eid)
    print(f"[qa] {eid} duration={dur}s bytes={p.stat().st_size} {status}")
print(f"[qa] measured={len(ids)} failed={len(bad)}")
sys.exit(1 if bad else 0)
PY
