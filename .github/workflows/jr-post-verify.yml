name: JR post-publish verification

# Read-only against Buffer. Checks every SCHEDULED episode whose time has passed.
# Manual only until authorised.
#
# on:
#   schedule:
#     - cron: '15 3,16 * * *'   # 08:45 and 21:45 IST

on:
  workflow_dispatch:
    inputs:
      dry_run:
        required: true
        default: 'false'

permissions:
  contents: write

concurrency:
  group: jr-post-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Safety tests (mocked Buffer, no network)
        run: python3 -m unittest discover -s tests
      - name: Verify
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/daily/jr_daily.py verify --all
      - name: Commit episode state
        if: always() && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes manifests generated/briefs generated/release-manifest.json 2>/dev/null || true
          git diff --cached --quiet && { echo "[state] nothing to commit"; exit 0; }
          git commit -m "automation: daily post state ${{ github.run_id }} [skip ci]"
          git pull --rebase -q && git push
