name: Jesus Replies weekly batch

# System B. ONE WEEK = ONE RELEASE = 14 VIDEOS (7 morning + 7 night).
# Manual dispatch only. The weekly schedule below stays commented out until one
# controlled publication has succeeded end to end. Does not touch daily-bible-post.yml.
#
# on:
#   schedule:
#     - cron: '30 18 * * 6'   # Sat 00:00 IST, ahead of a Monday week start

on:
  workflow_dispatch:
    inputs:
      week_start:
        description: First publishing day, YYYY-MM-DD (Monday)
        required: true
      publish:
        description: Create real Buffer posts. false = dry run.
        required: true
        default: 'false'

permissions:
  contents: write        # release create/upload/delete only

concurrency:
  group: jr-weekly-${{ inputs.week_start }}   # one run per week, no racing reruns
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Build the diversity briefs for all 14 slots
        run: npx tsx scripts/storage/weekly-plan.ts ${{ inputs.week_start }}

      - name: Authoring gate
        # Episode dialogue is authored through the Jesus Replies skill, which needs a
        # model call this workflow has no credential for. Until that is wired, the 14
        # episodes must already exist in generated/ or the run stops here rather than
        # publishing a short week.
        run: |
          MISSING=0
          for i in $(seq 1 14); do :; done
          COUNT=$(ls generated/JR-*.json 2>/dev/null | wc -l)
          echo "[weekly] authored_episodes_present=$COUNT expected=14"
          if [ "$COUNT" -lt 14 ]; then
            echo "BLOCKED: fewer than 14 authored episodes. Not publishing a partial week."
            exit 1
          fi

      - name: Render all 14 (bounded concurrency)
        # Uses the existing renderer. ENG-002 is respected: concurrency comes from the
        # runner's own core count, and JR_RENDER_CONCURRENCY pins it to the tested 2.
        env:
          JR_RENDER_CONCURRENCY: 2
        run: |
          mkdir -p output/videos
          for f in generated/JR-*.json; do
            case "$f" in *package*) continue;; esac
            id=$(basename "$f" .json)
            if [ -s "output/videos/$id.mp4" ]; then echo "[render] $id action=REUSED"; continue; fi
            echo "[render] $id action=RENDERING"
            npm run jr -- render "$f" --out-dir output || { echo "[render] $id action=FAILED"; exit 1; }
          done
          echo "[render] rendered=$(ls output/videos/*.mp4 2>/dev/null | wc -l) expected=14"

      - name: Render QA and real durations
        run: |
          python3 - <<'EOF'
          import pathlib, json, struct
          rows = []
          for v in sorted(pathlib.Path("output/videos").glob("JR-*.mp4")):
              d = v.read_bytes(); i = d.find(b"mvhd")
              ts, du = struct.unpack(">II", d[i+16:i+24]) if i > 0 else (0, 0)
              rows.append({"episode": v.stem, "bytes": v.stat().st_size,
                           "duration_s": round(du/ts, 2) if ts else None})
          pathlib.Path("output/durations.json").write_text(json.dumps(rows, indent=2))
          for r in rows: print(f"[qa] {r['episode']} duration={r['duration_s']}s bytes={r['bytes']}")
          bad = [r for r in rows if not r["duration_s"] or r["duration_s"] > 90]
          print(f"[qa] measured={len(rows)} over_ceiling_or_unreadable={len(bad)}")
          raise SystemExit(1 if (len(rows) != 14 or bad) else 0)
          EOF

      - name: Weekly release, URL verification, Buffer
        if: ${{ inputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
        run: |
          echo "HELD: release upload and the single controlled Buffer post run only after"
          echo "the duration report above has been reviewed. Nothing published."
          exit 1
