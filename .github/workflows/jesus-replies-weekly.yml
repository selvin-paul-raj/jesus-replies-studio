name: Jesus Replies weekly batch

# System B. ONE WEEK = ONE RELEASE = 14 VIDEOS (7 morning + 7 night).
# Manual dispatch only. The weekly schedule below stays commented out until one
# controlled publication has succeeded end to end. Does not touch daily-bible-post.yml.
#
# on:
#   schedule:
#     - cron: '30 18 * * 6'   # Sat 00:00 IST, ahead of a Monday week start

on:
  workflow_dispatch:
    inputs:
      week_start:
        description: First publishing day, YYYY-MM-DD (Monday)
        required: true
      publish:
        description: Create real Buffer posts. false = dry run.
        required: true
        default: 'false'

permissions:
  contents: write        # release create/upload/delete only

concurrency:
  group: jr-weekly-${{ inputs.week_start }}   # one run per week, no racing reruns
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Build the diversity briefs for all 14 slots
        run: npx tsx scripts/storage/weekly-plan.ts ${{ inputs.week_start }}

      - name: Authoring gate
        # Episode dialogue is authored through the Jesus Replies skill, which needs a
        # model call this workflow has no credential for. Until that is wired, the 14
        # episodes must already exist in generated/ or the run stops here rather than
        # publishing a short week.
        run: |
          MISSING=0
          for i in $(seq 1 14); do :; done
          COUNT=$(ls generated/JR-*.json 2>/dev/null | wc -l)
          echo "[weekly] authored_episodes_present=$COUNT expected=14"
          if [ "$COUNT" -lt 14 ]; then
            echo "BLOCKED: fewer than 14 authored episodes. Not publishing a partial week."
            exit 1
          fi

      - name: Render all 14 (bounded concurrency)
        # Uses the existing renderer. ENG-002 is respected: concurrency comes from the
        # runner's own core count, and JR_RENDER_CONCURRENCY pins it to the tested 2.
        env:
          JR_RENDER_CONCURRENCY: 2
        run: |
          mkdir -p output/videos
          for f in generated/JR-*.json; do
            case "$f" in *package*) continue;; esac
            id=$(basename "$f" .json)
            if [ -s "output/videos/$id.mp4" ]; then echo "[render] $id action=REUSED"; continue; fi
            echo "[render] $id action=RENDERING"
            npm run jr -- render "$f" --out-dir output || { echo "[render] $id action=FAILED"; exit 1; }
          done
          echo "[render] rendered=$(ls output/videos/*.mp4 2>/dev/null | wc -l) expected=14"

      - name: Render QA and real durations
        run: |
          python3 - <<'EOF'
          import pathlib, json, struct
          rows = []
          for v in sorted(pathlib.Path("output/videos").glob("JR-*.mp4")):
              d = v.read_bytes(); i = d.find(b"mvhd")
              ts, du = struct.unpack(">II", d[i+16:i+24]) if i > 0 else (0, 0)
              rows.append({"episode": v.stem, "bytes": v.stat().st_size,
                           "duration_s": round(du/ts, 2) if ts else None})
          pathlib.Path("output/durations.json").write_text(json.dumps(rows, indent=2))
          for r in rows: print(f"[qa] {r['episode']} duration={r['duration_s']}s bytes={r['bytes']}")
          bad = [r for r in rows if not r["duration_s"] or r["duration_s"] > 90]
          print(f"[qa] measured={len(rows)} over_ceiling_or_unreadable={len(bad)}")
          raise SystemExit(1 if (len(rows) != 14 or bad) else 0)
          EOF

      - name: Phase 2 package QA
        run: |
          python3 - <<'EOF'
          import json, pathlib
          eps = sorted(p.stem for p in pathlib.Path("generated").glob("JR-*.json") if ".package" not in p.name)
          bad = []
          for e in eps:
              pk = pathlib.Path(f"generated/{e}.package.json")
              if not pk.exists(): bad.append(f"{e}: no package"); continue
              d = json.loads(pk.read_text())
              for f in ("instagram_caption","instagram_hashtags","youtube_title","youtube_description","thumbnail_text"):
                  if not d.get(f): bad.append(f"{e}: missing {f}")
              if len(d["instagram_caption"]) > 2200: bad.append(f"{e}: caption too long")
              if len(d["youtube_title"]) > 100: bad.append(f"{e}: title too long")
              if len(d["youtube_description"]) > 5000: bad.append(f"{e}: description too long")
              if len(d["instagram_hashtags"]) != 5: bad.append(f"{e}: hashtag count")
              for other in eps:
                  if other != e and other in json.dumps(d): bad.append(f"{e}: references {other}")
          print(f"[pkg] episodes={len(eps)} packages_ok={len(eps)-len({b.split(':')[0] for b in bad})}")
          for b in bad: print("[pkg] FAIL", b)
          raise SystemExit(1 if (bad or len(eps) != 14) else 0)
          EOF

      - name: One weekly release, 14 assets, anonymous URL verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: jr-week-${{ inputs.week_start }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Idempotency: never blindly create a second weekly release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            n=$(gh release view "$TAG" --json assets --jq '[.assets[]|select(.name|endswith(".mp4"))]|length')
            echo "[release] $TAG exists with $n mp4 assets"
            if [ "$n" != "14" ]; then echo "[release] AMBIGUOUS existing release, failing closed"; exit 1; fi
            echo "[release] reusing existing complete release"
          else
            gh release create "$TAG" --title "Jesus Replies week of ${{ inputs.week_start }}" \
              --notes "Temporary public media storage for the 14 episodes of this week. Deleted only after the retention window." 
            echo "[release] created $TAG"
          fi
          for f in output/videos/JR-*.mp4; do
            gh release upload "$TAG" "$f" --clobber
            echo "[release] uploaded $(basename $f)"
          done
          python3 - <<'EOF'
          import json, os, subprocess, hashlib, pathlib, urllib.request
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          meta = json.loads(subprocess.run(["gh","release","view",tag,"--json","assets,createdAt,tagName"],
                                           capture_output=True,text=True,check=True).stdout)
          assets = [a for a in meta["assets"] if a["name"].endswith(".mp4")]
          names = [a["name"] for a in assets]
          assert len(assets) == 14, f"asset count {len(assets)}"
          assert len(set(names)) == 14, "duplicate asset names"
          durs = {r["episode"]: r["duration_s"] for r in json.loads(pathlib.Path("output/durations.json").read_text())}
          rows, fails = [], []
          for a in sorted(assets, key=lambda x: x["name"]):
              eid = a["name"][:-4]
              url = a.get("url") or f"https://github.com/{repo}/releases/download/{tag}/{a['name']}"
              # anonymous read, no token
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"jr-url-verify"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      head = r.read(32)
                      ct = r.headers.get("Content-Type","")
                      size = int(r.headers.get("Content-Length") or 0)
                      ok = r.status == 200 and url.startswith("https://") and b"ftyp" in head
              except Exception as ex:
                  ok, ct, size = False, f"ERROR {ex}", 0
              sha = hashlib.sha256(pathlib.Path(f"output/videos/{a['name']}").read_bytes()).hexdigest()
              rows.append({"release_tag": tag, "created_at": meta["createdAt"], "episode_id": eid,
                           "asset_name": a["name"], "public_url": url,
                           "duration_seconds": durs.get(eid), "size_bytes": a["size"],
                           "sha256": sha, "qa_status": "PASS" if ok else "FAIL"})
              print(f"[url] {eid} {'PASS' if ok else 'FAIL'} {size}B {ct}")
              if not ok: fails.append(eid)
          pathlib.Path("generated/release-manifest.json").write_text(json.dumps(rows, indent=2)+"\n")
          print(f"[url] verified={14-len(fails)}/14")
          raise SystemExit(1 if fails else 0)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/release-manifest.json
          git commit -m "content: release manifest for $TAG" || true
          git push || true

      - name: Buffer
        if: ${{ inputs.publish == 'true' }}
        run: |
          echo "Buffer is intentionally not wired into this workflow yet."
          echo "The controlled single mutation is a separate, explicitly authorised step."
          exit 1
